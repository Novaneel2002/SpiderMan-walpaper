<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spider-Man Interactive Desktop Wallpaper</title>
  <style>
    /* Standard desktop background styling */
    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      background-color: #0d0e15;
      user-select: none;
      -webkit-user-select: none;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      /* Pure black canvas backdrop matching the reference image */
      background-color: #000000;
    }
  </style>
</head>

<body>
  <canvas id="wallpaperCanvas"></canvas>

  <!-- 1. Configuration & Global State -->
  <script src="./config/settings.js"></script>

  <!-- 2. Character Behaviour State & Constants -->
  <script src="./behaviour/spidey-state.js"></script>

  <!-- 3. Image Block Layout, Caching, Rendering & Magnetic Field -->
  <script src="./image-block/card-renderer.js"></script>
  <script src="./image-block/cards-data.js"></script>
  <script src="./image-block/magnetic-field.js"></script>

  <!-- 4. Visual & Particle Effects -->
  <script src="./effects/particles.js"></script>

  <!-- 5. Swing Trajectory & Traversal Physics -->
  <script src="./traversal/swing-physics.js"></script>

  <!-- 6. Chibi Character Model & Pose Renderer -->
  <script src="./character/spidey-model.js"></script>
  <script src="./character/spidey-renderer.js"></script>

  <!-- 7. Character Behaviour Controller & Reactions -->
  <script src="./behaviour/spidey-behaviour.js"></script>

  <!-- 8. Core Render Loop & Adaptive Frame Pacing -->
  <script src="./core/loop.js"></script>

  <!-- 9. Import Web Traversal Module from ./traversal/web.html (works on file:// & http://) -->
  <script>
    window.addEventListener('message', function onWebModuleMsg(e) {
      if (e.data && e.data.type === 'SPIDEY_WEB_MODULE' && !window.__spideyWebLoaded) {
        window.__spideyWebLoaded = true;
        window.removeEventListener('message', onWebModuleMsg);
        (0, eval)(e.data.code);
        const frame = document.getElementById('webModuleFrame');
        if (frame && frame.parentNode) frame.parentNode.removeChild(frame);
        const inputScript = document.createElement('script');
        inputScript.src = './input/pointer-events.js';
        inputScript.onload = function () {
          startWallpaper();
        };
        document.body.appendChild(inputScript);
      }
    });
  </script>
  <iframe id="webModuleFrame" src="./traversal/web.html" style="display:none" aria-hidden="true"></iframe>
</body>

</html>
