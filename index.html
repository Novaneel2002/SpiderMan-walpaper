<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spider-Man Interactive Desktop Wallpaper</title>
  <style>
    /* Requirement 1: Standard desktop background styling */
    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      background-color: #0d0e15;
      user-select: none;
      -webkit-user-select: none;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      /* Pure black canvas backdrop matching the reference image */
      background-color: #000000;
    }
  </style>
</head>

<body>
  <canvas id="wallpaperCanvas"></canvas>

  <script>
    /**
     * Spider-Man Interactive Collage Wallpaper for Lively Wallpaper (Chromium / WebView2)
     * - Strictly relative "./images/..." paths (no absolute system paths or leading root slashes).
     * - Localized Magnetic Field Interaction ("magnet & iron dust" behavior) with 3s auto-relax,
     *   card depth shadows, rim light, inner window parallax, and pre-rendered risograph film grain.
     * - Chibi Cartoon Spider-Man (matching the uploaded Ultimate Spider-Man chibi reference):
     *   - Randomizes top-row card perches between 3 modes (upside-down hang from bottom edge,
     *     side-border perch, or low top crouch) so his head never clips off-screen.
     *   - 180ms hover dwell debounce before swinging, launch crouch anticipation, C1 velocity-continuous
     *     mid-swing retargeting, mid-air speed lines, ground/card shadow, and landing dust puffs.
     *   - Smooth squash-turn when flipping left/right, unified z-order sitting transition, natural
     *     randomized blinking (with double-blinks), long-idle behaviors (>18s: yawn/stretch, lying down,
     *     or web-hang), autonomous roaming after 22s of mouse inactivity, and click interactions ("THWIP!"
     *     web splat on cards + excited backflip/wave when clicking Spider-Man).
     * - Zero heap allocations inside requestAnimationFrame + adaptive 30 FPS idle throttling.
     */
    (function () {
      'use strict';

      const canvas = document.getElementById('wallpaperCanvas');
      const ctx = canvas.getContext('2d', { alpha: false });

      // Reference design dimensions (16:9 aspect ratio matching the 1024x576 reference image)
      const REF_WIDTH = 1024;
      const REF_HEIGHT = 576;

      // Configurable Settings (customizable live via LivelyProperties.json)
      const config = {
        showSpidey: true,
        spideyScale: 1.15,
        maxMagnetScale: 1.22,
        magnetRadius: 185,
        maxMagnetPull: 14,
        grainAmount: 0.085,
        hoverDwellTime: 0.18,       // 180ms cursor dwell required before triggering a swing
        sassyPoseDelay: 2.0,        // 2s -> sassy hands-on-hips squint pose
        idleSitDelay: 5.0,          // 5s -> sit & dangle legs over border
        deepIdleDelay: 18.0         // 18s -> deep idle (yawn, lie flat, or hang upside-down on web)
      };

      const IDLE_SCALE = 1.0;
      const INNER_CORE_RADIUS = 18;

      // Smooth viscous-fluid damping rates (lower = slower, silkier, zero bounce)
      const CURSOR_SMOOTH_RATE = 8.5;
      const SCALE_SMOOTH_RATE = 5.0;
      const PULL_SMOOTH_RATE = 5.5;

      // Pre-allocated typed arrays for Chibi Head webbing (zero heap allocation in render loop)
      const HEAD_SPOKES = new Float32Array([
        -2.85, -2.35, -1.85, -1.35, -0.85, -0.35, 0.25, 0.85, 1.45, 2.15, 2.7
      ]);
      const HEAD_RADII_FACTORS = new Float32Array([3.6, 7.2, 11.2, 15.2]);

      // Viewport & centered 16:9 stage state (prevents stretching on ultrawide 21:9 or 16:10 displays)
      let viewWidth = window.innerWidth;
      let viewHeight = window.innerHeight;
      let dpr = Math.min(window.devicePixelRatio || 1, 3);
      let uniformScale = 1;
      let stageOffsetX = 0;
      let stageOffsetY = 0;
      let scaledMagnetRadius = config.magnetRadius;
      let scaledInnerRadius = INNER_CORE_RADIUS;
      let scaledMaxPull = config.maxMagnetPull;

      // Pointer state (raw, smoothed, and inactivity timeout)
      let rawMouseX = -9999;
      let rawMouseY = -9999;
      let smoothMouseX = -9999;
      let smoothMouseY = -9999;
      let isPointerActive = false;
      let timeSinceMouseMove = 999;

      // Timing & adaptive frame-rate state
      let lastFrameTime = performance.now();
      let lastRenderTime = 0;
      let elapsedTime = 0;
      let isPageHidden = document.hidden;
      let rafId = 0;

      // Optional Lively Wallpaper audio reactivity state (0 when silent/unused)
      let audioEnergy = 0;
      let targetAudioEnergy = 0;

      // Pre-rendered seamless film grain / halftone pattern
      let grainPattern = null;
      let grainCanvas = null; // Source tile, reused to bake grain into each card cache

      function createFilmGrainPattern() {
        const gCanvas = document.createElement('canvas');
        const size = 128;
        gCanvas.width = size;
        gCanvas.height = size;
        const gCtx = gCanvas.getContext('2d');
        const imgData = gCtx.createImageData(size, size);
        const data = imgData.data;

        for (let i = 0; i < data.length; i += 4) {
          const pxIdx = i >> 2;
          const x = pxIdx & (size - 1);
          const y = pxIdx >> 7;
          // Subtle halftone dot modulation + monochrome film grain
          const halftone = ((x & 1) === 0 && (y & 1) === 0) ? 28 : -18;
          const noise = Math.max(0, Math.min(255, 128 + ((Math.random() - 0.5) * 170) + halftone));
          data[i] = noise;
          data[i + 1] = noise;
          data[i + 2] = noise;
          data[i + 3] = 255;
        }
        gCtx.putImageData(imgData, 0, 0);
        grainPattern = ctx.createPattern(gCanvas, 'repeat');
        grainCanvas = gCanvas;
      }

      // Pre-allocated subtle background dust pool (capped at 120, zero heap allocation in loop)
      const PARTICLE_COUNT = 120;
      const particleX = new Float32Array(PARTICLE_COUNT);
      const particleY = new Float32Array(PARTICLE_COUNT);
      const particleVx = new Float32Array(PARTICLE_COUNT);
      const particleVy = new Float32Array(PARTICLE_COUNT);
      const particleSize = new Float32Array(PARTICLE_COUNT);

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particleX[i] = Math.random() * REF_WIDTH;
        particleY[i] = Math.random() * REF_HEIGHT;
        particleVx[i] = (Math.random() - 0.5) * 0.15;
        particleVy[i] = (Math.random() - 0.5) * 0.15;
        particleSize[i] = 0.8 + Math.random() * 1.2;
      }

      // Pre-allocated landing dust / impact particles pool (zero GC allocation)
      const DUST_POOL_SIZE = 14;
      const dustX = new Float32Array(DUST_POOL_SIZE);
      const dustY = new Float32Array(DUST_POOL_SIZE);
      const dustVx = new Float32Array(DUST_POOL_SIZE);
      const dustVy = new Float32Array(DUST_POOL_SIZE);
      const dustRadius = new Float32Array(DUST_POOL_SIZE);
      const dustAlpha = new Float32Array(DUST_POOL_SIZE);
      let activeDustCount = 0;

      function spawnLandingImpact(x, y, normalX, normalY) {
        activeDustCount = 8;
        for (let i = 0; i < activeDustCount; i++) {
          const spread = ((i / (activeDustCount - 1)) - 0.5) * 2.2;
          const tangentX = -normalY;
          const tangentY = normalX;
          const speed = (28 + (i % 3) * 16) * uniformScale;
          dustX[i] = x + tangentX * spread * 6 * uniformScale;
          dustY[i] = y + normalY * 2 * uniformScale;
          dustVx[i] = (tangentX * spread + normalX * (0.35 + (i % 2) * 0.25)) * speed;
          dustVy[i] = (tangentY * spread + normalY * (0.35 + (i % 2) * 0.25)) * speed;
          dustRadius[i] = (2.2 + (i % 3) * 1.1) * uniformScale;
          dustAlpha[i] = 0.85;
        }
      }

      /**
       * Exact 11 card definitions measured from the 1024x576 reference image.
       * All paths use explicit relative "./images/..." notation (no leading slash or absolute path).
       */
      const CARD_DEFINITIONS = [
        {
          // 0. Top-Left ("GIMME.") - TOP ROW
          x: 45, y: 34, w: 106, h: 107, radius: 16, isTopRow: true, sideDir: 1,
          src: './images/gimme.jpg',
          altSrc: './images/gimme.jpg',
          crop: null
        },
        {
          // 1. Top-Mid-Left (Hands on head) - TOP ROW
          x: 313, y: 31, w: 97, h: 80, radius: 16, isTopRow: true, sideDir: 1,
          src: './images/download%20(4)-2.jpg',
          altSrc: './images/download (4)-2.jpg',
          crop: { sxRatio: 0, syRatio: 0.5017, swRatio: 1.0, shRatio: 0.4642 }
        },
        {
          // 2. Upper-Mid-Right ("AWESOME." hammock)
          x: 610, y: 89, w: 127, h: 105, radius: 18, isTopRow: false, sideDir: -1,
          src: './images/Peter%20Parker-2.jpg',
          altSrc: './images/Peter Parker-2.jpg',
          crop: null
        },
        {
          // 3. Top-Right (Holding camera) - TOP ROW
          x: 844, y: 29, w: 124, h: 119, radius: 18, isTopRow: true, sideDir: -1,
          src: './images/download%20(3)-2.jpg',
          altSrc: './images/download (3)-2.jpg',
          crop: null
        },
        {
          // 4. Mid-Left (In hospital bed)
          x: 154, y: 217, w: 149, h: 117, radius: 18, isTopRow: false, sideDir: 1,
          src: './images/download%20(2)-2.jpg',
          altSrc: './images/download (2)-2.jpg',
          crop: null
        },
        {
          // 5. Center ("ur not spider man / hell yes i am")
          x: 391, y: 166, w: 153, h: 146, radius: 20, isTopRow: false, sideDir: 1,
          src: './images/center-spider-man.jpg',
          altSrc: 'images/center-spider-man.jpg',
          crop: null
        },
        {
          // 6. Mid-Right ("OWWW MY LEG...")
          x: 785, y: 207, w: 141, h: 132, radius: 18, isTopRow: false, sideDir: -1,
          src: './images/Spider%20Man-2.jpg',
          altSrc: './images/Spider Man-2.jpg',
          crop: null
        },
        {
          // 7. Bottom-Left ("OF COURSE THIS HAPPENS WHEN I CAN'T AFFORD A THERAPIST.")
          x: 41, y: 424, w: 114, h: 104, radius: 16, isTopRow: false, sideDir: 1,
          src: './images/download%20(5)-2.jpg',
          altSrc: './images/download (5)-2.jpg',
          crop: null
        },
        {
          // 8. Bottom-Mid-Left (Upside down with headphones)
          x: 361, y: 372, w: 111, h: 108, radius: 16, isTopRow: false, sideDir: 1,
          src: './images/Classic%20teenage%20Spider-Man%20_%20%E2%9C%8C%F0%9F%8F%BB-2.jpg',
          altSrc: './images/Classic teenage Spider-Man _ \u270C\uD83C\uDFFB-2.jpg',
          crop: null
        },
        {
          // 9. Bottom-Mid-Right (Hands on cheeks with hearts)
          x: 614, y: 403, w: 121, h: 124, radius: 18, isTopRow: false, sideDir: -1,
          src: './images/spidey%20icon%20%E2%98%85-2.jpg',
          altSrc: './images/spidey icon \u2605-2.jpg',
          crop: null
        },
        {
          // 10. Bottom-Right (Sitting on chair in park)
          x: 869, y: 411, w: 109, h: 118, radius: 16, isTopRow: false, sideDir: -1,
          src: './images/Spider-Man-2.jpg',
          altSrc: 'images/Spider-Man-2.jpg',
          crop: null
        }
      ];

      // Pre-allocated runtime state for each card
      const CARD_COUNT = CARD_DEFINITIONS.length;
      const cards = new Array(CARD_COUNT);
      const drawOrder = new Int32Array(CARD_COUNT);

      /**
       * Rebuilds a card's offscreen pre-rendered bitmap.
       */
      function rebuildCardCache(card) {
        if (!card.loaded) return;
        const targetW = Math.max(16, Math.round(card.baseW * config.maxMagnetScale * dpr));
        const targetH = Math.max(16, Math.round(card.baseH * config.maxMagnetScale * dpr));

        if (!card.cacheCanvas) {
          card.cacheCanvas = document.createElement('canvas');
          card.cacheCtx = card.cacheCanvas.getContext('2d');
        }
        card.cacheCanvas.width = targetW;
        card.cacheCanvas.height = targetH;

        const cCtx = card.cacheCtx;
        cCtx.clearRect(0, 0, targetW, targetH);
        cCtx.imageSmoothingEnabled = true;
        cCtx.imageSmoothingQuality = 'high';
        cCtx.drawImage(card.img, card.sx, card.sy, card.sw, card.sh, 0, 0, targetW, targetH);

        // Bake the risograph / film grain overlay into the cache once (saves a full-card
        // overlay composite per card per frame)
        if (config.grainAmount > 0.005) {
          if (!grainCanvas) createFilmGrainPattern();
          const bakedPattern = cCtx.createPattern(grainCanvas, 'repeat');
          cCtx.save();
          cCtx.globalAlpha = config.grainAmount;
          cCtx.globalCompositeOperation = 'overlay';
          cCtx.scale(dpr, dpr);
          cCtx.fillStyle = bakedPattern;
          cCtx.fillRect(0, 0, targetW / dpr, targetH / dpr);
          cCtx.restore();
        }
        card.cacheW = targetW;
        card.cacheH = targetH;
      }

      for (let i = 0; i < CARD_COUNT; i++) {
        drawOrder[i] = i;
        const def = CARD_DEFINITIONS[i];
        const img = new Image();
        img.decoding = 'async';

        const card = {
          refCx: def.x + def.w * 0.5,
          refCy: def.y + def.h * 0.5,
          refW: def.w,
          refH: def.h,
          refRadius: def.radius,
          isTopRow: def.isTopRow,
          sideDir: def.sideDir,
          cx: 0,
          cy: 0,
          baseW: 0,
          baseH: 0,
          baseRadius: 0,
          sx: 0,
          sy: 0,
          sw: 1,
          sh: 1,
          cropSpec: def.crop,
          scale: IDLE_SCALE,
          targetScale: IDLE_SCALE,
          offsetX: 0,
          offsetY: 0,
          targetOffsetX: 0,
          targetOffsetY: 0,
          fieldStrength: 0,
          loadProgress: 0, // 0 -> 1 over 400ms on load for smooth fade+scale-in
          img: img,
          cacheCanvas: null,
          cacheCtx: null,
          cacheW: 1,
          cacheH: 1,
          loaded: false,
          triedAlt: false
        };

        img.onload = function () {
          const natW = img.naturalWidth || img.width;
          const natH = img.naturalHeight || img.height;

          if (card.cropSpec) {
            card.sx = natW * card.cropSpec.sxRatio;
            card.sy = natH * card.cropSpec.syRatio;
            card.sw = natW * card.cropSpec.swRatio;
            card.sh = natH * card.cropSpec.shRatio;
          } else {
            const targetAR = card.refW / card.refH;
            const srcAR = natW / natH;
            if (srcAR > targetAR) {
              card.sh = natH;
              card.sw = natH * targetAR;
              card.sx = (natW - card.sw) * 0.5;
              card.sy = 0;
            } else {
              card.sw = natW;
              card.sh = natW / targetAR;
              card.sx = 0;
              card.sy = (natH - card.sh) * 0.5;
            }
          }
          card.loaded = true;
          card.loadProgress = 0.001;
          rebuildCardCache(card);
        };

        img.onerror = function () {
          if (!card.triedAlt && def.altSrc) {
            card.triedAlt = true;
            img.src = def.altSrc;
          }
        };

        img.src = def.src;
        cards[i] = card;
      }

      /**
       * Perch Modes for Top-Row Cards (randomized so Spider-Man's head never clips off-screen):
       * - 0: Standard top-edge perch (used for all non-top-row cards)
       * - 1: Hang upside-down from the bottom edge of the card
       * - 2: Sit/perch on the inner vertical side edge of the card
       * - 3: Low superhero crouch on the top edge (keeps head well below top screen border)
       */
      const PERCH_TOP_NORMAL = 0;
      const PERCH_BOTTOM_UPSIDE_DOWN = 1;
      const PERCH_SIDE_EDGE = 2;
      const PERCH_TOP_CROUCH = 3;

      /**
       * Deep Idle Modes after ~18s perched:
       * - 0: Sleepy yawn & big overhead arm stretch ("Zzz...")
       * - 1: Lying flat on his back/stomach chilling on the card edge
       * - 2: Hanging upside-down from a short silk web thread below the card
       */
      const DEEP_IDLE_YAWN = 0;
      const DEEP_IDLE_LIE_DOWN = 1;
      const DEEP_IDLE_WEB_HANG = 2;

      // Swing modes
      const SWING_PENDULUM = 0; // Real pendulum arc around the web anchor
      const SWING_ZIP = 1;      // Web-zip: fire a web at the target and get yanked to it

      // Time of day (checked once a minute, never inside the render loop)
      const TOD_DAY = 0;
      const TOD_NIGHT = 1;   // 23:00 - 05:00 -> drowsy, falls asleep sooner
      const TOD_MORNING = 2; // 06:00 - 10:00 -> coffee mug while sitting, yawns
      let timeOfDayMode = TOD_DAY;
      function updateTimeOfDay() {
        const h = new Date().getHours();
        timeOfDayMode = (h >= 23 || h < 5) ? TOD_NIGHT : ((h >= 6 && h < 10) ? TOD_MORNING : TOD_DAY);
      }
      updateTimeOfDay();
      setInterval(updateTimeOfDay, 60000);

      function getDeepIdleDelay() {
        return timeOfDayMode === TOD_NIGHT ? Math.min(config.deepIdleDelay, 9.0) : config.deepIdleDelay;
      }

      // Hover reactions for special cards (indexed by card index)
      const REACT_NONE = 0;
      const REACT_GIMME = 1;
      const REACT_AWESOME = 2;
      const REACT_CAMERA = 3;
      const REACT_HELLYES = 4;
      const REACT_OWW = 5;
      const REACT_SWEAT = 6;
      const REACT_MUSIC = 7;
      const REACT_HEARTS = 8;
      const REACT_CONFUSED = 9;
      const REACT_OUCH = 10;
      const REACT_CHILL = 11;
      const CARD_REACTIONS = new Int8Array([
        REACT_GIMME,    // 0 "GIMME."
        REACT_CONFUSED, // 1 hands on head
        REACT_AWESOME,  // 2 "AWESOME." hammock
        REACT_CAMERA,   // 3 holding camera
        REACT_OUCH,     // 4 hospital bed
        REACT_HELLYES,  // 5 "hell yes i am"
        REACT_OWW,      // 6 "OWWW MY LEG"
        REACT_SWEAT,    // 7 therapist
        REACT_MUSIC,    // 8 headphones
        REACT_HEARTS,   // 9 hands on cheeks with hearts
        REACT_CHILL     // 10 park chair
      ]);

      // Pendulum time-warp table: maps normalized time -> angle fraction so he speeds up
      // through the bottom of the arc and slows near the top (energy conservation)
      const PEND_SAMPLES = 48;
      const pendTimeTable = new Float32Array(PEND_SAMPLES + 1);
      let pendTh0 = 0;
      let pendTh1 = 0;
      let pendR0 = 0;
      let pendR1 = 0;

      /**
       * Chibi Spider-Man Swinging & Idle State Machine (Pre-allocated, zero GC pressure)
       */
      const spidey = {
        currentCard: 5,
        originCard: 5,
        perchMode: PERCH_TOP_NORMAL,
        nextPerchMode: PERCH_TOP_NORMAL,
        x: 0,
        y: 0,
        vx: 0,
        vy: 0,
        isSwinging: false,
        swingT: 1,
        swingDuration: 0.75,
        preJumpTimer: 0,       // >0 during the 0.11s launch crouch before takeoff
        pendingTargetCard: -1, // Card index waiting for preJumpTimer to finish
        hoverCandidateCard: -1,// Card currently under cursor for dwell debounce
        hoverDwellTimer: 0,    // Seconds cursor has rested on hoverCandidateCard
        startX: 0,
        startY: 0,
        ctrlX: 0,
        ctrlY: 0,
        endX: 0,
        endY: 0,
        anchorX: 0,
        anchorY: 0,
        anchorCard: -1,
        anchorRelX: 0,
        anchorRelY: 0,
        facing: 1,             // Target facing direction: 1 = right, -1 = left
        facingScale: 1,        // Smoothly interpolated [-1..1] for squash-turn over ~0.15s
        turnHop: 0,            // Subtle vertical hop during squash-turn
        landSquash: 0,
        idleTime: 0,
        sassyBlend: 0,
        sitBlend: 0,
        deepIdleBlend: 0,
        deepIdleMode: DEEP_IDLE_YAWN,
        // Natural randomized blink state
        blinkTimer: 2.8,
        blinkProgress: 0,
        isBlinking: false,
        pendingDoubleBlink: false,
        // Click flip/wave state (when clicking directly on Spider-Man)
        flipTimer: 0,
        handWorldX: 0,         // Exact world X of Spider-Man's web-shooting hand
        handWorldY: 0,         // Exact world Y of Spider-Man's web-shooting hand
        headWorldX: 0,         // World position of his head (eye tracking, reactions, cast shadow)
        headWorldY: 0,
        headRot: 0,            // World rotation / flip of the head (for eye-tracking space)
        headFlipY: 1,
        // Swing mode state
        swingMode: SWING_PENDULUM,
        endIsCard: true,
        isChainSegment: false, // True during web #1 of a two-web long-distance swing
        chainTargetCard: -1,
        carryVx: 0,
        carryVy: 0,
        carryTime: 0,
        // Eye tracking & reactions
        lookX: 0,
        lookY: 0,
        cursorNear: 0,
        windBlend: 0,
        windDir: 1,
        reactionCode: 0,
        reactionBlend: 0,
        initialized: false
      };

      // Detached trailing web line that gently fades out after release
      const trailingWeb = {
        active: false,
        alpha: 0,
        handX: 0,   // Free (released) end of the strand - falls under gravity
        handY: 0,
        vx: 0,
        vy: 0,
        anchorX: 0, // Still stuck to the surface it was shot at
        anchorY: 0
      };

      /**
       * Detaches the current swing web: the free end keeps a bit of Spider-Man's momentum
       * and then droops/falls under gravity while fading out.
       */
      function releaseWebStrand(alphaStart) {
        trailingWeb.active = true;
        trailingWeb.alpha = alphaStart;
        trailingWeb.handX = spidey.handWorldX || spidey.x;
        trailingWeb.handY = spidey.handWorldY || (spidey.y - 12 * uniformScale);
        trailingWeb.anchorX = spidey.anchorX;
        trailingWeb.anchorY = spidey.anchorY;
        trailingWeb.vx = spidey.vx * 0.35;
        trailingWeb.vy = spidey.vy * 0.2;
        // Leave a lingering web tag where the strand was stuck
        addWebTag(
          spidey.anchorX, spidey.anchorY,
          Math.atan2(spidey.anchorY - trailingWeb.handY, spidey.anchorX - trailingWeb.handX),
          spidey.anchorCard, spidey.anchorRelX, spidey.anchorRelY
        );
      }

      // Lingering web tags: faded splats + short dangling threads that fade out over ~30s
      const TAG_POOL = 14;
      const TAG_LIFETIME = 30;
      const tagX = new Float32Array(TAG_POOL);
      const tagY = new Float32Array(TAG_POOL);
      const tagAngle = new Float32Array(TAG_POOL);
      const tagAge = new Float32Array(TAG_POOL).fill(999);
      const tagCard = new Int16Array(TAG_POOL);
      const tagRelX = new Float32Array(TAG_POOL);
      const tagRelY = new Float32Array(TAG_POOL);
      const tagSeed = new Float32Array(TAG_POOL);
      let tagCursor = 0;

      function addWebTag(x, y, angle, cardIdx, relX, relY) {
        const i = tagCursor;
        tagCursor = (tagCursor + 1) % TAG_POOL;
        tagX[i] = x;
        tagY[i] = y;
        tagAngle[i] = angle;
        tagCard[i] = cardIdx;
        tagRelX[i] = relX;
        tagRelY[i] = relY;
        tagAge[i] = 0;
        tagSeed[i] = Math.random();
      }

      function updateWebTags(dt) {
        for (let i = 0; i < TAG_POOL; i++) {
          if (tagAge[i] < TAG_LIFETIME) tagAge[i] += dt;
        }
      }

      function drawWebTags() {
        const us = uniformScale;
        for (let i = 0; i < TAG_POOL; i++) {
          const age = tagAge[i];
          if (age >= TAG_LIFETIME) continue;
          let x = tagX[i];
          let y = tagY[i];
          const ci = tagCard[i];
          if (ci >= 0) {
            const c = cards[ci];
            const sc = c.scale * (1 + audioEnergy * 0.025);
            x = (c.cx + c.offsetX) + tagRelX[i] * c.baseW * sc;
            y = (c.cy + c.offsetY) + tagRelY[i] * c.baseH * sc;
          }
          const life = 1 - age / TAG_LIFETIME;
          const a = 0.42 * Math.min(1, age / 0.6) * life * Math.sqrt(life);
          if (a < 0.01) continue;

          drawSplatAt(x, y, tagAngle[i], 6.0 * us, a);

          // Short dangling remnant thread swaying slightly
          const len = (7 + tagSeed[i] * 8) * us;
          const sway = Math.sin(elapsedTime * 1.7 + tagSeed[i] * 6.0) * 2.2 * us;
          ctx.save();
          ctx.globalAlpha = a * 0.8;
          ctx.strokeStyle = '#eef3fb';
          ctx.lineWidth = Math.max(0.6, 0.8 * us);
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.quadraticCurveTo(x + sway * 0.4, y + len * 0.55, x + sway, y + len);
          ctx.stroke();
          ctx.restore();
        }
      }

      // Pre-rendered soft shadow sprite for Spider-Man's cast shadow onto cards
      const shadowSprite = document.createElement('canvas');
      shadowSprite.width = 64;
      shadowSprite.height = 64;
      (function () {
        const g = shadowSprite.getContext('2d');
        const grad = g.createRadialGradient(32, 32, 2, 32, 32, 32);
        grad.addColorStop(0, 'rgba(0,0,0,0.85)');
        grad.addColorStop(0.55, 'rgba(0,0,0,0.42)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = grad;
        g.fillRect(0, 0, 64, 64);
      })();

      /**
       * Casts a soft shadow from Spider-Man (light from the top-left) onto whichever card
       * lies behind him, clipped to that card - so he reads as standing in front of it.
       */
      function drawSpideyCastShadow() {
        if (!config.showSpidey || !spidey.initialized || !spidey.headWorldX) return;
        const s = uniformScale * config.spideyScale;
        const bx = (spidey.x + spidey.headWorldX) * 0.5 + 7 * s;
        const by = (spidey.y + spidey.headWorldY) * 0.5 + 10 * s;
        for (let i = CARD_COUNT - 1; i >= 0; i--) {
          const c = cards[drawOrder[i]];
          if (!c.loaded) continue;
          const sc = c.scale * (1 + audioEnergy * 0.025);
          const hw = c.baseW * sc * 0.5;
          const hh = c.baseH * sc * 0.5;
          const cx = c.cx + c.offsetX;
          const cy = c.cy + c.offsetY;
          if (Math.abs(bx - cx) > hw + 14 * s || Math.abs(by - cy) > hh + 14 * s) continue;
          ctx.save();
          traceRoundedRect(cx - hw, cy - hh, hw * 2, hh * 2, c.baseRadius * sc);
          ctx.clip();
          ctx.globalAlpha = spidey.isSwinging ? 0.22 : 0.34;
          const w = 40 * s;
          const h = 46 * s;
          ctx.drawImage(shadowSprite, bx - w * 0.5, by - h * 0.5, w, h);
          ctx.restore();
          break;
        }
      }

      // Interactive "THWIP!" click web shot & comic bubble state
      const clickEffect = {
        active: false,
        timer: 0,
        duration: 1.15,
        targetX: 0,
        targetY: 0,
        cardIdx: -1,
        relX: 0,
        relY: 0,
        isSpideyClick: false
      };

      /**
       * Picks a randomized perch mode when swinging to a card:
       * Top-row cards randomize between hanging upside-down from the bottom edge (1),
       * sitting on the inner side border (2), or low crouching on the top border (3).
       */
      function choosePerchModeForCard(idx) {
        const c = cards[idx];
        if (!c.isTopRow) return PERCH_TOP_NORMAL;
        const r = Math.random();
        if (r < 0.36) return PERCH_BOTTOM_UPSIDE_DOWN;
        if (r < 0.70) return PERCH_SIDE_EDGE;
        return PERCH_TOP_CROUCH;
      }

      /**
       * Computes the exact world perch X and Y for card `idx` and `mode`.
       */
      function getCardPerchX(idx, mode) {
        const c = cards[idx];
        const currentScale = c.scale * (1 + audioEnergy * 0.025);
        const halfW = (c.baseW * currentScale) * 0.5;
        if (mode === PERCH_SIDE_EDGE) {
          return (c.cx + c.offsetX) + c.sideDir * halfW;
        }
        return c.cx + c.offsetX;
      }

      function getCardPerchY(idx, mode) {
        const c = cards[idx];
        const currentScale = c.scale * (1 + audioEnergy * 0.025);
        const halfH = (c.baseH * currentScale) * 0.5;
        if (mode === PERCH_BOTTOM_UPSIDE_DOWN) {
          return (c.cy + c.offsetY) + halfH;
        }
        if (mode === PERCH_SIDE_EDGE) {
          return (c.cy + c.offsetY) - halfH * 0.12;
        }
        return (c.cy + c.offsetY) - halfH;
      }

      /**
       * Clamps an arbitrary point (px, py) onto the exact outer border of card `idx`
       * and writes the normalized relative coordinates into temp variables.
       */
      let tempBorderX = 0;
      let tempBorderY = 0;
      let tempRelX = 0;
      let tempRelY = 0;

      function projectPointToCardBorder(idx, px, py) {
        const c = cards[idx];
        const currentScale = c.scale * (1 + audioEnergy * 0.025);
        const w = c.baseW * currentScale;
        const h = c.baseH * currentScale;
        const halfW = w * 0.5;
        const halfH = h * 0.5;
        const centerX = c.cx + c.offsetX;
        const centerY = c.cy + c.offsetY;

        let dx = Math.max(-halfW, Math.min(halfW, px - centerX));
        let dy = Math.max(-halfH, Math.min(halfH, py - centerY));

        const distLeft = Math.abs(dx + halfW);
        const distRight = Math.abs(halfW - dx);
        const distTop = Math.abs(dy + halfH);
        const distBottom = Math.abs(halfH - dy);
        const minDist = Math.min(distLeft, distRight, distTop, distBottom);

        if (minDist === distBottom) {
          dy = halfH;
        } else if (minDist === distTop) {
          dy = -halfH;
        } else if (minDist === distLeft) {
          dx = -halfW;
        } else {
          dx = halfW;
        }

        tempBorderX = centerX + dx;
        tempBorderY = centerY + dy;
        tempRelX = dx / Math.max(1, w);
        tempRelY = dy / Math.max(1, h);
      }

      /**
       * Selects the most realistic physical web anchor on either:
       * 1. The nearest suitable image card's border/corner above the swing trajectory, OR
       * 2. The nearest screen border (top edge y=0, left edge x=0, or right edge x=viewWidth).
       */
      function resolvePhysicalWebAnchor(startX, startY, endX, endY, originCardIdx, targetCardIdx) {
        const dx = endX - startX;
        const dy = endY - startY;
        const jumpDist = Math.hypot(dx, dy);

        const idealX = startX + dx * 0.55;
        const highestY = Math.min(startY, endY);
        const lowestY = Math.max(startY, endY);
        const idealLift = Math.max(95 * uniformScale, Math.min(220 * uniformScale, jumpDist * 0.38));
        const idealY = Math.max(0, highestY - idealLift);

        let bestScore = 1e18;
        let bestX = idealX;
        let bestY = 0;
        let bestCard = -1;
        let bestRelX = 0;
        let bestRelY = 0;

        // --- Candidate 1: Screen Borders ---
        const topEdgeX = Math.max(16, Math.min(viewWidth - 16, idealX));
        const topEdgeY = 0;
        const distToTopScreen = Math.hypot(topEdgeX - idealX, topEdgeY - idealY) + (highestY - topEdgeY) * 0.35;
        if (distToTopScreen < bestScore) {
          bestScore = distToTopScreen;
          bestX = topEdgeX;
          bestY = topEdgeY;
          bestCard = -1;
        }

        if (idealX < viewWidth * 0.28) {
          const leftEdgeX = 0;
          const leftEdgeY = Math.max(16, Math.min(highestY - 25 * uniformScale, idealY));
          const distToLeftScreen = Math.hypot(leftEdgeX - idealX, leftEdgeY - idealY) + 30 * uniformScale;
          if (distToLeftScreen < bestScore) {
            bestScore = distToLeftScreen;
            bestX = leftEdgeX;
            bestY = leftEdgeY;
            bestCard = -1;
          }
        }

        if (idealX > viewWidth * 0.72) {
          const rightEdgeX = viewWidth;
          const rightEdgeY = Math.max(16, Math.min(highestY - 25 * uniformScale, idealY));
          const distToRightScreen = Math.hypot(rightEdgeX - idealX, rightEdgeY - idealY) + 30 * uniformScale;
          if (distToRightScreen < bestScore) {
            bestScore = distToRightScreen;
            bestX = rightEdgeX;
            bestY = rightEdgeY;
            bestCard = -1;
          }
        }

        // --- Candidate 2: Nearest Image Card Borders ---
        const minPathX = Math.min(startX, endX) - 130 * uniformScale;
        const maxPathX = Math.max(startX, endX) + 130 * uniformScale;

        for (let i = 0; i < CARD_COUNT; i++) {
          if (i === originCardIdx) continue;

          projectPointToCardBorder(i, idealX, idealY);
          const bx = tempBorderX;
          const by = tempBorderY;

          if (i === targetCardIdx) {
            if (endY < startY - 70 * uniformScale) {
              const c = cards[i];
              const currentScale = c.scale * (1 + audioEnergy * 0.025);
              const cornerX = (c.cx + c.offsetX) + (dx >= 0 ? -1 : 1) * (c.baseW * currentScale) * 0.35;
              const cornerY = (c.cy + c.offsetY) - (c.baseH * currentScale) * 0.5;
              const zipScore = Math.hypot(cornerX - idealX, cornerY - idealY) + 45 * uniformScale;
              if (zipScore < bestScore) {
                bestScore = zipScore;
                bestX = cornerX;
                bestY = cornerY;
                bestCard = i;
                bestRelX = (dx >= 0 ? -0.35 : 0.35);
                bestRelY = -0.5;
              }
            }
            continue;
          }

          if (by > lowestY - 15 * uniformScale) continue;
          if (bx < minPathX || bx > maxPathX) continue;

          const aboveBonus = by <= highestY ? -35 * uniformScale : 20 * uniformScale;
          const cardScore = Math.hypot(bx - idealX, by - idealY) + aboveBonus;

          if (cardScore < bestScore) {
            bestScore = cardScore;
            bestX = bx;
            bestY = by;
            bestCard = i;
            bestRelX = tempRelX;
            bestRelY = tempRelY;
          }
        }

        spidey.anchorX = bestX;
        spidey.anchorY = bestY;
        spidey.anchorCard = bestCard;
        spidey.anchorRelX = bestRelX;
        spidey.anchorRelY = bestRelY;
      }

      /**
       * Updates the web anchor coordinates if the web is attached to a card border
       * that is currently moving slightly under the magnetic field.
       */
      function updateLiveWebAnchor() {
        if (spidey.anchorCard !== -1) {
          const c = cards[spidey.anchorCard];
          const currentScale = c.scale * (1 + audioEnergy * 0.025);
          const w = c.baseW * currentScale;
          const h = c.baseH * currentScale;
          spidey.anchorX = (c.cx + c.offsetX) + spidey.anchorRelX * w;
          spidey.anchorY = (c.cy + c.offsetY) + spidey.anchorRelY * h;
        }
      }

      /**
       * Requests a swing to `targetCardIdx`:
       * - If Spider-Man is currently perched, triggers a brief 0.11s launch crouch before takeoff.
       * - If Spider-Man is already mid-swing, smoothly blends his current velocity into the new arc.
       */
      function requestSwingToCard(targetCardIdx) {
        if (targetCardIdx < 0 || targetCardIdx === spidey.currentCard) return;
        if (!spidey.isSwinging && spidey.preJumpTimer <= 0) {
          spidey.pendingTargetCard = targetCardIdx;
          spidey.preJumpTimer = 0.11;
          const targetX = getCardPerchX(targetCardIdx, PERCH_TOP_NORMAL);
          spidey.facing = (targetX - spidey.x) >= 0 ? 1 : -1;
          return;
        }
        if (spidey.preJumpTimer > 0) {
          spidey.pendingTargetCard = targetCardIdx;
          const targetX = getCardPerchX(targetCardIdx, PERCH_TOP_NORMAL);
          spidey.facing = (targetX - spidey.x) >= 0 ? 1 : -1;
          return;
        }
        launchSwingNow(targetCardIdx, true);
      }

      /**
       * Decides how Spider-Man travels to `targetCardIdx`:
       * - Web-zip: target is clearly higher (or very close) -> fire web at it and get yanked up.
       * - Two-web swing: very long horizontal jumps -> swing, let go mid-air, fire a 2nd web.
       * - Pendulum swing: everything else.
       */
      function launchSwingNow(targetCardIdx, carryVelocity) {
        if (targetCardIdx === spidey.currentCard || targetCardIdx < 0) return;

        if (spidey.isSwinging && isWebStillAttached()) {
          releaseWebStrand(0.85);
        }

        const previousCard = spidey.currentCard;
        spidey.originCard = previousCard;
        spidey.currentCard = targetCardIdx;
        spidey.nextPerchMode = choosePerchModeForCard(targetCardIdx);
        spidey.isChainSegment = false;
        spidey.chainTargetCard = -1;

        // Reset idle timers when launching a swing
        spidey.idleTime = 0;
        spidey.sassyBlend = 0;
        spidey.sitBlend = 0;
        spidey.deepIdleBlend = 0;
        spidey.reactionBlend = 0;

        const ex = getCardPerchX(targetCardIdx, spidey.nextPerchMode);
        const ey = getCardPerchY(targetCardIdx, spidey.nextPerchMode);
        const dx = ex - spidey.x;
        const dy = ey - spidey.y;
        const dist = Math.hypot(dx, dy);
        const rise = spidey.y - ey; // > 0 when the target is higher
        const us = uniformScale;

        if ((rise > 50 * us && Math.abs(dx) < rise * 1.4) || (dist < 140 * us && rise > -20 * us)) {
          beginSwingSegment(SWING_ZIP, ex, ey, true, previousCard, carryVelocity);
        } else if (Math.abs(dx) > viewWidth * 0.42) {
          // Two-web swing: web #1 carries him to a mid-air release point
          const mx = spidey.x + dx * 0.5;
          const my = Math.max(60 * us, Math.min(viewHeight * 0.55, Math.min(spidey.y, ey) - 30 * us));
          spidey.isChainSegment = true;
          spidey.chainTargetCard = targetCardIdx;
          beginSwingSegment(SWING_PENDULUM, mx, my, false, previousCard, carryVelocity);
        } else {
          beginSwingSegment(SWING_PENDULUM, ex, ey, true, previousCard, carryVelocity);
        }
      }

      function isWebStillAttached() {
        if (!spidey.isSwinging) return false;
        if (spidey.swingMode === SWING_ZIP) return spidey.swingT < 0.94;
        return spidey.isChainSegment || spidey.swingT < 0.85;
      }

      /**
       * Starts a single swing segment from Spider-Man's current position to (endX, endY).
       */
      function beginSwingSegment(mode, endX, endY, endIsCard, originCardIdx, carryVelocity) {
        const us = uniformScale;
        spidey.swingMode = mode;
        spidey.startX = spidey.x;
        spidey.startY = spidey.y;
        spidey.endX = endX;
        spidey.endY = endY;
        spidey.endIsCard = endIsCard;

        const dx = endX - spidey.startX;
        const dy = endY - spidey.startY;
        const dist = Math.hypot(dx, dy);
        if (Math.abs(dx) > 2) spidey.facing = dx >= 0 ? 1 : -1;

        const hasCarry = carryVelocity && (Math.abs(spidey.vx) + Math.abs(spidey.vy) > 20);
        spidey.carryVx = hasCarry ? spidey.vx : 0;
        spidey.carryVy = hasCarry ? spidey.vy : 0;
        spidey.carryTime = hasCarry ? 0.2 : 0;

        spidey.swingT = 0;
        spidey.isSwinging = true;

        if (mode === SWING_ZIP) {
          spidey.swingDuration = Math.min(0.7, Math.max(0.42, 0.42 + (dist / Math.max(1, viewHeight)) * 0.3));
          spidey.anchorCard = -1; // Anchor follows the live landing point every frame
          spidey.anchorX = endX;
          spidey.anchorY = endY;
          return;
        }

        spidey.swingDuration = Math.min(1.1, Math.max(0.6, 0.5 + (dist / Math.max(1, viewWidth)) * 0.72));
        resolvePhysicalWebAnchor(spidey.startX, spidey.startY, endX, endY, originCardIdx, endIsCard ? spidey.currentCard : -1);

        // A pendulum needs its pivot above both ends - otherwise anchor to the top of the screen
        if (spidey.anchorY > Math.min(spidey.startY, endY) - 25 * us) {
          spidey.anchorX = Math.max(16, Math.min(viewWidth - 16, spidey.startX + dx * 0.55));
          spidey.anchorY = 0;
          spidey.anchorCard = -1;
        }
        buildPendulumTable();
      }

      /**
       * Recomputes pendulum angles/radii from the live anchor (cards may drift under the magnet).
       * Angles are measured from straight-down, positive to the right.
       */
      function computePendulumGeometry() {
        const ax = spidey.anchorX;
        const ay = spidey.anchorY;
        pendTh0 = Math.atan2(spidey.startX - ax, spidey.startY - ay);
        let th1 = Math.atan2(spidey.endX - ax, spidey.endY - ay);
        if (th1 - pendTh0 > Math.PI) th1 -= Math.PI * 2;
        else if (pendTh0 - th1 > Math.PI) th1 += Math.PI * 2;
        pendTh1 = th1;
        pendR0 = Math.hypot(spidey.startX - ax, spidey.startY - ay);
        pendR1 = Math.hypot(spidey.endX - ax, spidey.endY - ay);
      }

      /**
       * Builds the time-warp table using energy conservation: speed ~ sqrt(height dropped).
       */
      function buildPendulumTable() {
        computePendulumGeometry();
        const ax = spidey.anchorX;
        const ay = spidey.anchorY;
        const yRef = Math.min(spidey.startY, spidey.endY);
        let maxY = yRef;
        for (let i = 0; i <= PEND_SAMPLES; i++) {
          const f = i / PEND_SAMPLES;
          const th = pendTh0 + (pendTh1 - pendTh0) * f;
          const r = pendR0 + (pendR1 - pendR0) * (f * f * (3 - 2 * f));
          const y = ay + Math.cos(th) * r;
          if (y > maxY) maxY = y;
        }
        const vMin2 = Math.max(30 * uniformScale, (maxY - yRef) * 0.22);
        let px = spidey.startX;
        let py = spidey.startY;
        let total = 0;
        pendTimeTable[0] = 0;
        for (let i = 1; i <= PEND_SAMPLES; i++) {
          const f = i / PEND_SAMPLES;
          const th = pendTh0 + (pendTh1 - pendTh0) * f;
          const r = pendR0 + (pendR1 - pendR0) * (f * f * (3 - 2 * f));
          const x = ax + Math.sin(th) * r;
          const y = ay + Math.cos(th) * r;
          const yMid = (py + y) * 0.5;
          const v = Math.sqrt(vMin2 + 2 * Math.max(0, yMid - yRef));
          total += Math.hypot(x - px, y - py) / v;
          pendTimeTable[i] = total;
          px = x;
          py = y;
        }
        for (let i = 0; i <= PEND_SAMPLES; i++) {
          pendTimeTable[i] = total > 0 ? pendTimeTable[i] / total : i / PEND_SAMPLES;
        }
      }

      function computePendulumPosition(t) {
        let i = 0;
        while (i < PEND_SAMPLES - 1 && pendTimeTable[i + 1] < t) i++;
        const ta = pendTimeTable[i];
        const tb = pendTimeTable[i + 1];
        const local = tb > ta ? Math.max(0, Math.min(1, (t - ta) / (tb - ta))) : 0;
        const f = Math.max(0, Math.min(1, (i + local) / PEND_SAMPLES));
        computePendulumGeometry();
        const th = pendTh0 + (pendTh1 - pendTh0) * f;
        const r = pendR0 + (pendR1 - pendR0) * (f * f * (3 - 2 * f));
        spidey.x = spidey.anchorX + Math.sin(th) * r;
        spidey.y = spidey.anchorY + Math.cos(th) * r;
      }

      /**
       * Web-zip: hold while the web flies (t < 0.16), then a hard yank that eases into the landing.
       */
      function computeZipPosition(t) {
        const hold = 0.16;
        const k = t <= hold ? 0 : (t - hold) / (1 - hold);
        const e = 1 - Math.pow(1 - k, 2.6);
        const dx = spidey.endX - spidey.startX;
        const dy = spidey.endY - spidey.startY;
        const d = Math.max(1, Math.hypot(dx, dy));
        let nx = -dy / d;
        let ny = dx / d;
        if (ny < 0) { nx = -nx; ny = -ny; }
        const bulge = Math.sin(k * Math.PI) * Math.min(18 * uniformScale, d * 0.12);
        spidey.x = spidey.startX + dx * e + nx * bulge;
        spidey.y = spidey.startY + dy * e + ny * bulge;
      }

      /**
       * Recalculates canvas resolution and centered 16:9 responsive card geometry on window resize.
       */
      function handleResize() {
        viewWidth = window.innerWidth;
        viewHeight = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 3);

        canvas.width = Math.round(viewWidth * dpr);
        canvas.height = Math.round(viewHeight * dpr);

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        if (!grainPattern) {
          createFilmGrainPattern();
        }

        // Centered 16:9 stage with gentle aspect-ratio breathing room so 21:9/16:10 never distort
        const rawScaleX = viewWidth / REF_WIDTH;
        const rawScaleY = viewHeight / REF_HEIGHT;
        uniformScale = Math.min(rawScaleX, rawScaleY);

        // Allow up to 12% gentle spacing expansion on ultrawide/tall monitors while centering the rest
        const layoutScaleX = uniformScale + (rawScaleX - uniformScale) * 0.35;
        const layoutScaleY = uniformScale + (rawScaleY - uniformScale) * 0.35;
        stageOffsetX = (viewWidth - REF_WIDTH * layoutScaleX) * 0.5;
        stageOffsetY = (viewHeight - REF_HEIGHT * layoutScaleY) * 0.5;

        scaledMagnetRadius = config.magnetRadius * uniformScale;
        scaledInnerRadius = INNER_CORE_RADIUS * uniformScale;
        scaledMaxPull = config.maxMagnetPull * uniformScale;

        for (let i = 0; i < CARD_COUNT; i++) {
          const c = cards[i];
          c.cx = stageOffsetX + c.refCx * layoutScaleX;
          c.cy = stageOffsetY + c.refCy * layoutScaleY;
          c.baseW = c.refW * uniformScale;
          c.baseH = c.refH * uniformScale;
          c.baseRadius = c.refRadius * uniformScale;
          if (c.loaded) {
            rebuildCardCache(c);
          }
        }

        if (!spidey.initialized) {
          spidey.perchMode = PERCH_TOP_NORMAL;
          spidey.x = getCardPerchX(spidey.currentCard, spidey.perchMode);
          spidey.y = getCardPerchY(spidey.currentCard, spidey.perchMode);
          spidey.initialized = true;
        }
      }

      /**
       * Computes each card's localized magnetic attraction and debounced Spider-Man swing trigger.
       */
      function updateMagneticTargets(dt) {
        if (!isPointerActive) {
          spidey.hoverCandidateCard = -1;
          spidey.hoverDwellTimer = 0;
          for (let i = 0; i < CARD_COUNT; i++) {
            const c = cards[i];
            c.targetScale = IDLE_SCALE;
            c.targetOffsetX = 0;
            c.targetOffsetY = 0;
            c.fieldStrength = 0;
          }
          return;
        }

        const effectiveSpan = Math.max(1, scaledMagnetRadius - scaledInnerRadius);
        let strongestCard = -1;
        let strongestField = 0;

        for (let i = 0; i < CARD_COUNT; i++) {
          const c = cards[i];
          const dx = smoothMouseX - c.cx;
          const dy = smoothMouseY - c.cy;
          const dist = Math.hypot(dx, dy);

          if (dist >= scaledMagnetRadius) {
            c.targetScale = IDLE_SCALE;
            c.targetOffsetX = 0;
            c.targetOffsetY = 0;
            c.fieldStrength = 0;
            continue;
          }

          const r = dist <= scaledInnerRadius
            ? 0
            : (dist - scaledInnerRadius) / effectiveSpan;

          const oneMinusR2 = 1 - r * r;
          const fieldStrength = oneMinusR2 * oneMinusR2;
          c.fieldStrength = fieldStrength;

          if (fieldStrength > strongestField) {
            strongestField = fieldStrength;
            strongestCard = i;
          }

          c.targetScale = IDLE_SCALE + (config.maxMagnetScale - IDLE_SCALE) * fieldStrength;

          if (dist > 0.001) {
            const pullFactor = fieldStrength * Math.min(1, dist / (scaledInnerRadius * 2.5));
            const pullMag = scaledMaxPull * pullFactor;
            c.targetOffsetX = (dx / dist) * pullMag;
            c.targetOffsetY = (dy / dist) * pullMag;
          } else {
            c.targetOffsetX = 0;
            c.targetOffsetY = 0;
          }
        }

        // Hover dwell debounce (180ms default) so brushing past cards doesn't cause jittery swings
        if (config.showSpidey && strongestCard !== -1 && strongestField > 0.32 && strongestCard !== spidey.currentCard) {
          if (spidey.hoverCandidateCard === strongestCard) {
            spidey.hoverDwellTimer += dt;
            if (spidey.hoverDwellTimer >= config.hoverDwellTime) {
              spidey.hoverDwellTimer = 0;
              requestSwingToCard(strongestCard);
            }
          } else {
            spidey.hoverCandidateCard = strongestCard;
            spidey.hoverDwellTimer = 0;
          }
        } else {
          spidey.hoverCandidateCard = -1;
          spidey.hoverDwellTimer = 0;
        }
      }

      /**
       * Updates natural randomized blinking (with 25% chance of double-blink).
       */
      function updateNaturalBlinking(dt) {
        if (spidey.isBlinking) {
          spidey.blinkProgress += dt / 0.15;
          if (spidey.blinkProgress >= 1) {
            spidey.blinkProgress = 0;
            spidey.isBlinking = false;
            if (spidey.pendingDoubleBlink) {
              spidey.pendingDoubleBlink = false;
              spidey.blinkTimer = 0.09;
            } else {
              spidey.blinkTimer = 2.2 + Math.random() * 3.8;
            }
          }
        } else {
          spidey.blinkTimer -= dt;
          if (spidey.blinkTimer <= 0) {
            spidey.isBlinking = true;
            spidey.blinkProgress = 0;
            spidey.pendingDoubleBlink = Math.random() < 0.26;
          }
        }
      }

      /**
       * Updates Spider-Man's pendulum swing trajectory, launch crouch, squash-turn,
       * autonomous roaming, and multi-stage idle progression.
       */
      function updateSpiderMan(dt) {
        if (!config.showSpidey) return;

        updateNaturalBlinking(dt);

        // Eye tracking toward the cursor + squint when the cursor gets very close
        {
          const s = uniformScale * config.spideyScale;
          let tx = 0;
          let ty = 0;
          let near = 0;
          if (isPointerActive && spidey.headWorldX) {
            const ddx = smoothMouseX - spidey.headWorldX;
            const ddy = smoothMouseY - spidey.headWorldY;
            const d = Math.hypot(ddx, ddy);
            tx = ddx / (d + 60 * uniformScale);
            ty = ddy / (d + 60 * uniformScale);
            near = Math.max(0, Math.min(1, 1 - (d - 22 * s) / (40 * s)));
          }
          const lookA = 1 - Math.exp(-10 * dt);
          spidey.lookX += (tx - spidey.lookX) * lookA;
          spidey.lookY += (ty - spidey.lookY) * lookA;
          spidey.cursorNear += (near - spidey.cursorNear) * (1 - Math.exp(-8 * dt));

          // "Wind" brace when the cursor is whipped around fast
          const windTarget = (!spidey.isSwinging && isPointerActive)
            ? Math.max(0, Math.min(1, (mouseSpeed / Math.max(0.1, uniformScale) - 1600) / 2400))
            : 0;
          const windRate = windTarget > spidey.windBlend ? 7.0 : 2.2;
          spidey.windBlend += (windTarget - spidey.windBlend) * (1 - Math.exp(-windRate * dt));
          spidey.windDir += (mouseDirX - spidey.windDir) * (1 - Math.exp(-5 * dt));
        }

        // Smooth squash-turn interpolation over ~0.15s when facing flips between -1 and 1
        const prevFacingScale = spidey.facingScale;
        const turnRate = 18.0;
        spidey.facingScale += (spidey.facing - spidey.facingScale) * (1 - Math.exp(-turnRate * dt));
        if (Math.abs(spidey.facing - spidey.facingScale) < 0.01) {
          spidey.facingScale = spidey.facing;
        }
        // Subtle hop when passing through 0 during a turn
        if (prevFacingScale * spidey.facingScale <= 0 || Math.abs(spidey.facing - spidey.facingScale) > 0.15) {
          spidey.turnHop = (1 - Math.abs(spidey.facingScale)) * 2.5 * uniformScale;
        } else {
          spidey.turnHop = 0;
        }

        if (spidey.landSquash > 0) {
          spidey.landSquash = Math.max(0, spidey.landSquash - dt * 3.8);
        }

        if (spidey.flipTimer > 0) {
          spidey.flipTimer = Math.max(0, spidey.flipTimer - dt / 0.65);
        }

        if (clickEffect.active) {
          const prevClickTimer = clickEffect.timer;
          clickEffect.timer += dt;
          // Leave a lingering web tag where the click web stuck
          if (!clickEffect.isSpideyClick && prevClickTimer < 0.14 && clickEffect.timer >= 0.14) {
            addWebTag(
              clickEffect.targetX, clickEffect.targetY,
              Math.atan2(clickEffect.targetY - spidey.handWorldY, clickEffect.targetX - spidey.handWorldX),
              clickEffect.cardIdx, clickEffect.relX, clickEffect.relY
            );
          }
          if (clickEffect.timer >= clickEffect.duration) {
            clickEffect.active = false;
          }
        }

        if (trailingWeb.active) {
          trailingWeb.alpha -= dt * 1.25;
          trailingWeb.vy += 1100 * uniformScale * dt;      // gravity
          trailingWeb.vx *= Math.exp(-3.0 * dt);            // air drag
          trailingWeb.handX += trailingWeb.vx * dt;
          trailingWeb.handY += trailingWeb.vy * dt;
          if (trailingWeb.alpha <= 0) {
            trailingWeb.alpha = 0;
            trailingWeb.active = false;
          }
        }

        // Update landing dust particles
        if (activeDustCount > 0) {
          let anyAlive = false;
          for (let i = 0; i < activeDustCount; i++) {
            if (dustAlpha[i] > 0.01) {
              dustX[i] += dustVx[i] * dt;
              dustY[i] += dustVy[i] * dt;
              dustVx[i] *= Math.exp(-5.5 * dt);
              dustVy[i] *= Math.exp(-5.5 * dt);
              dustAlpha[i] -= dt * 2.4;
              anyAlive = true;
            }
          }
          if (!anyAlive) activeDustCount = 0;
        }

        // Handle 0.11s launch crouch anticipation before jumping off a card
        if (spidey.preJumpTimer > 0) {
          spidey.preJumpTimer -= dt;
          spidey.x = getCardPerchX(spidey.currentCard, spidey.perchMode);
          spidey.y = getCardPerchY(spidey.currentCard, spidey.perchMode);
          if (spidey.preJumpTimer <= 0 && spidey.pendingTargetCard !== -1) {
            const nextTarget = spidey.pendingTargetCard;
            spidey.pendingTargetCard = -1;
            launchSwingNow(nextTarget, false);
          }
          return;
        }

        if (!spidey.isSwinging) {
          spidey.x = getCardPerchX(spidey.currentCard, spidey.perchMode);
          spidey.y = getCardPerchY(spidey.currentCard, spidey.perchMode);
          spidey.vx = 0;
          spidey.vy = 0;

          // Progress through chibi idle states:
          // 0..2s:   Top panel pose (hands raised, wide giant eyes)
          // 2..5s:   Bottom panel pose (hands on hips, sassy squinting eyes)
          // 5..18s:  Sitting on the card edge dangling and kicking his stubby legs
          // >18s:    Deep idle behavior (yawn/stretch, lying flat on card, or web-hang)
          spidey.idleTime += dt;

          const deepDelay = getDeepIdleDelay();
          const wasBelowDeep = (spidey.idleTime - dt) < deepDelay;
          if (wasBelowDeep && spidey.idleTime >= deepDelay) {
            const r = Math.random();
            if (timeOfDayMode === TOD_NIGHT) {
              spidey.deepIdleMode = r < 0.15 ? DEEP_IDLE_YAWN : (r < 0.8 ? DEEP_IDLE_LIE_DOWN : DEEP_IDLE_WEB_HANG);
            } else if (timeOfDayMode === TOD_MORNING) {
              spidey.deepIdleMode = r < 0.7 ? DEEP_IDLE_YAWN : (r < 0.9 ? DEEP_IDLE_LIE_DOWN : DEEP_IDLE_WEB_HANG);
            } else {
              spidey.deepIdleMode = r < 0.34 ? DEEP_IDLE_YAWN : (r < 0.68 ? DEEP_IDLE_LIE_DOWN : DEEP_IDLE_WEB_HANG);
            }
          }

          let targetSassy = (spidey.idleTime >= config.sassyPoseDelay && spidey.idleTime < config.idleSitDelay) ? 1.0 : 0.0;
          let targetSit = spidey.idleTime >= config.idleSitDelay ? 1.0 : 0.0;
          let targetDeep = spidey.idleTime >= deepDelay ? 1.0 : 0.0;

          // Hover reactions on special cards (cursor resting on the card he's perched on)
          const reactCode = CARD_REACTIONS[spidey.currentCard] | 0;
          const wantReact = reactCode !== REACT_NONE && isPointerActive &&
            cards[spidey.currentCard].fieldStrength > 0.45 && spidey.idleTime > 0.35 && spidey.flipTimer <= 0;
          if (wantReact || spidey.reactionBlend < 0.02) spidey.reactionCode = reactCode;
          spidey.reactionBlend += ((wantReact ? 1 : 0) - spidey.reactionBlend) * (1 - Math.exp(-(wantReact ? 6.0 : 3.0) * dt));
          if (wantReact) {
            targetDeep = 0;
            if (reactCode === REACT_HELLYES) { targetSassy = 1; targetSit = 0; }
            else if (reactCode === REACT_GIMME) { targetSassy = 0; targetSit = 0; }
            else if (reactCode === REACT_AWESOME) { spidey.deepIdleMode = DEEP_IDLE_LIE_DOWN; targetDeep = 1; }
            else if (reactCode === REACT_CHILL) { targetSit = 1; targetSassy = 0; }
          }

          spidey.sassyBlend += (targetSassy - spidey.sassyBlend) * (1 - Math.exp(-5.0 * dt));
          spidey.sitBlend += (targetSit - spidey.sitBlend) * (1 - Math.exp(-4.2 * dt));
          spidey.deepIdleBlend += (targetDeep - spidey.deepIdleBlend) * (1 - Math.exp(-3.2 * dt));

          if (isPointerActive) {
            const lookDx = smoothMouseX - spidey.x;
            if (Math.abs(lookDx) > 16 * uniformScale) {
              spidey.facing = lookDx >= 0 ? 1 : -1;
            }
          }
          return;
        }

        if (spidey.endIsCard) {
          spidey.endX = getCardPerchX(spidey.currentCard, spidey.nextPerchMode);
          spidey.endY = getCardPerchY(spidey.currentCard, spidey.nextPerchMode);
        }
        if (spidey.swingMode === SWING_ZIP) {
          spidey.anchorX = spidey.endX;
          spidey.anchorY = spidey.endY;
        } else {
          updateLiveWebAnchor();
        }

        const prevSwingT = spidey.swingT;
        spidey.swingT += dt / spidey.swingDuration;

        // Let go of the web near the end of a normal pendulum arc -> it droops and falls away
        if (spidey.swingMode === SWING_PENDULUM && !spidey.isChainSegment && prevSwingT < 0.85 && spidey.swingT >= 0.85) {
          releaseWebStrand(0.9);
        }

        if (spidey.swingT >= 1) {
          // Two-web swing: let go of web #1 mid-air and immediately fire web #2 at the real target
          if (spidey.isChainSegment && spidey.chainTargetCard >= 0) {
            spidey.isChainSegment = false;
            spidey.x = spidey.endX;
            spidey.y = spidey.endY;
            releaseWebStrand(0.9);
            const tgt = spidey.chainTargetCard;
            spidey.chainTargetCard = -1;
            beginSwingSegment(
              SWING_PENDULUM,
              getCardPerchX(tgt, spidey.nextPerchMode),
              getCardPerchY(tgt, spidey.nextPerchMode),
              true, -1, true
            );
            return;
          }

          const wasZip = spidey.swingMode === SWING_ZIP;
          spidey.swingT = 1;
          spidey.isSwinging = false;
          spidey.isChainSegment = false;
          spidey.perchMode = spidey.nextPerchMode;
          spidey.x = spidey.endX;
          spidey.y = spidey.endY;
          spidey.vx = 0;
          spidey.vy = 0;
          spidey.landSquash = 1.0;
          spidey.idleTime = 0;
          spidey.sassyBlend = 0;
          spidey.sitBlend = 0;
          spidey.deepIdleBlend = 0;

          if (wasZip) {
            // The zip web stays stuck where he landed
            const c = cards[spidey.currentCard];
            const sc = c.scale * (1 + audioEnergy * 0.025);
            addWebTag(
              spidey.x, spidey.y, -Math.PI * 0.5, spidey.currentCard,
              (spidey.x - (c.cx + c.offsetX)) / Math.max(1, c.baseW * sc),
              (spidey.y - (c.cy + c.offsetY)) / Math.max(1, c.baseH * sc)
            );
          }

          // Spawn landing dust / comic impact ticks at the perch surface
          if (spidey.perchMode === PERCH_BOTTOM_UPSIDE_DOWN) {
            spawnLandingImpact(spidey.x, spidey.y, 0, 1);
          } else if (spidey.perchMode === PERCH_SIDE_EDGE) {
            spawnLandingImpact(spidey.x, spidey.y, cards[spidey.currentCard].sideDir, 0);
          } else {
            spawnLandingImpact(spidey.x, spidey.y, 0, -1);
          }
          return;
        }

        const t = spidey.swingT;
        const prevX = spidey.x;
        const prevY = spidey.y;

        if (spidey.swingMode === SWING_ZIP) {
          computeZipPosition(t);
        } else {
          computePendulumPosition(t);
        }

        // Blend in the previous momentum for ~0.2s after a mid-air retarget (no velocity pops)
        if (spidey.carryTime > 0) {
          const el = t * spidey.swingDuration;
          if (el < spidey.carryTime) {
            const w0 = 1 - el / spidey.carryTime;
            const w = w0 * w0;
            spidey.x += (spidey.startX + spidey.carryVx * el - spidey.x) * w;
            spidey.y += (spidey.startY + spidey.carryVy * el - spidey.y) * w;
          }
        }

        spidey.y = Math.min(spidey.y, viewHeight - 14 * uniformScale);
        spidey.vx = (spidey.x - prevX) / dt;
        spidey.vy = (spidey.y - prevY) / dt;
      }

      // Pre-allocated buffers for the realistic web strand (zero heap allocations per frame)
      const WEB_SEGMENTS = 20;
      const STRAND_SAMPLES = 64;
      const webPtX = new Float32Array(WEB_SEGMENTS + 1);
      const webPtY = new Float32Array(WEB_SEGMENTS + 1);
      // Irregular impact-splat tendrils (angles relative to the incoming web direction)
      const SPLAT_ANGLES = new Float32Array([-2.55, -1.6, -0.75, 0.2, 1.05, 1.95, 2.75]);
      const SPLAT_LENGTHS = new Float32Array([0.8, 1.15, 0.7, 1.05, 0.85, 1.2, 0.65]);

      /**
       * Draws a realistic silk web strand from (x1, y1) [shooter / hand] to (x2, y2) [anchor]:
       * - tension:  0 = slack (sags under gravity) .. 1 = taut (straight)
       * - wobble:   signed perpendicular vibration amplitude (snap-back / sway)
       * - showSplat: draw the irregular glob + mini-web where the strand sticks
       * Strand is tapered (thick at the hand, thin at the anchor), fades toward the anchor,
       * and has two twisted fibres braided around the core. While flying, the tip is a liquid glob.
       */
      function drawWebLine(x1, y1, x2, y2, shootProgress, alpha, tension, wobble, showSplat) {
        if (alpha <= 0.01) return;
        if (tension === undefined) tension = 1;
        if (wobble === undefined) wobble = 0;
        if (showSplat === undefined) showSplat = true;

        const sp = Math.max(0, Math.min(1, shootProgress));
        const tipX = x1 + (x2 - x1) * sp;
        const tipY = y1 + (y2 - y1) * sp;
        const dx = tipX - x1;
        const dy = tipY - y1;
        const len = Math.hypot(dx, dy);
        if (len < 0.5) return;

        const us = uniformScale;
        const nx = -dy / len;
        const ny = dx / len;
        const tens = Math.max(0, Math.min(1, tension));
        const sag = (1 - tens) * Math.min(len * 0.22, 70 * us);
        const flight = 1 - sp;

        // 1. Build the centre-line: gravity sag + vibration + in-flight ripple
        for (let i = 0; i <= WEB_SEGMENTS; i++) {
          const u = i / WEB_SEGMENTS;
          const bell = Math.sin(u * Math.PI);
          let off = wobble * (bell + 0.35 * Math.sin(u * Math.PI * 2));
          off += Math.sin(u * Math.PI * 3 - elapsedTime * 22) * flight * 8 * us * bell;
          webPtX[i] = x1 + dx * u + nx * off;
          webPtY[i] = y1 + dy * u + ny * off + 4 * u * (1 - u) * sag;
        }

        ctx.save();
        const baseW = Math.max(1.3, 1.9 * us);

        // 2. Tapered dark outline + silk core (butt caps per segment -> no alpha beading)
        ctx.lineCap = 'butt';
        ctx.strokeStyle = '#0f1423';
        for (let i = 0; i < WEB_SEGMENTS; i++) {
          const u = (i + 0.5) / WEB_SEGMENTS;
          ctx.globalAlpha = alpha * 0.5 * (1 - 0.4 * u);
          ctx.lineWidth = baseW * (1 - 0.55 * u) + 1.3 * us;
          ctx.beginPath();
          ctx.moveTo(webPtX[i], webPtY[i]);
          ctx.lineTo(webPtX[i + 1], webPtY[i + 1]);
          ctx.stroke();
        }
        ctx.strokeStyle = '#eef3fb';
        for (let i = 0; i < WEB_SEGMENTS; i++) {
          const u = (i + 0.5) / WEB_SEGMENTS;
          ctx.globalAlpha = alpha * 0.85 * (1 - 0.45 * u);
          ctx.lineWidth = baseW * (1 - 0.55 * u);
          ctx.beginPath();
          ctx.moveTo(webPtX[i], webPtY[i]);
          ctx.lineTo(webPtX[i + 1], webPtY[i + 1]);
          ctx.stroke();
        }

        // 3. Two twisted fibres braided around the core
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = Math.max(0.5, 0.62 * us);
        const twists = Math.min(len / (15 * us), STRAND_SAMPLES * 0.22);
        for (let k = 0; k < 2; k++) {
          const phase = k * Math.PI;
          ctx.globalAlpha = alpha * (k === 0 ? 0.75 : 0.45);
          ctx.beginPath();
          for (let j = 0; j <= STRAND_SAMPLES; j++) {
            const u = j / STRAND_SAMPLES;
            const f = u * WEB_SEGMENTS;
            const i0 = Math.min(WEB_SEGMENTS - 1, f | 0);
            const fr = f - i0;
            const bx = webPtX[i0] + (webPtX[i0 + 1] - webPtX[i0]) * fr;
            const by = webPtY[i0] + (webPtY[i0 + 1] - webPtY[i0]) * fr;
            const tw = Math.sin(u * twists * Math.PI * 2 + phase) * baseW * 0.8 * (1 - 0.5 * u);
            if (j === 0) ctx.moveTo(bx + nx * tw, by + ny * tw);
            else ctx.lineTo(bx + nx * tw, by + ny * tw);
          }
          ctx.stroke();
        }

        const ux = dx / len;
        const uy = dy / len;

        if (sp < 0.999) {
          // 4. Liquid glob at the flying tip (teardrop stretched along travel + trailing droplets)
          ctx.fillStyle = '#ffffff';
          ctx.globalAlpha = alpha;
          ctx.beginPath();
          ctx.ellipse(tipX, tipY, 3.2 * us, 2.1 * us, Math.atan2(uy, ux), 0, Math.PI * 2);
          ctx.fill();
          for (let d = 1; d <= 2; d++) {
            const jitter = Math.sin(elapsedTime * 34 + d * 1.7) * 1.4 * us;
            ctx.globalAlpha = alpha * (0.6 - d * 0.2);
            ctx.beginPath();
            ctx.ellipse(
              tipX - ux * d * 5.5 * us + nx * jitter,
              tipY - uy * d * 5.5 * us + ny * jitter,
              (2.2 - d * 0.6) * us, (1.5 - d * 0.4) * us,
              Math.atan2(uy, ux), 0, Math.PI * 2
            );
            ctx.fill();
          }
        } else if (showSplat) {
          drawSplatAt(tipX, tipY, Math.atan2(uy, ux), 7.5 * us, alpha);
        }

        ctx.restore();
      }

      /**
       * Irregular web impact splat: uneven curved tendrils + scalloped mini-web + small glob.
       */
      function drawSplatAt(x, y, angle, r, alpha) {
        if (alpha <= 0.01) return;
        const us = uniformScale;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.lineCap = 'round';

        ctx.strokeStyle = '#ffffff';
        ctx.globalAlpha = alpha * 0.9;
        ctx.lineWidth = Math.max(0.9, 1.1 * us);
        ctx.beginPath();
        for (let k = 0; k < SPLAT_ANGLES.length; k++) {
          const a = SPLAT_ANGLES[k];
          const l = SPLAT_LENGTHS[k] * r;
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(
            Math.cos(a + 0.28) * l * 0.55, Math.sin(a + 0.28) * l * 0.55,
            Math.cos(a) * l, Math.sin(a) * l
          );
        }
        ctx.stroke();

        ctx.globalAlpha = alpha * 0.55;
        ctx.lineWidth = Math.max(0.6, 0.75 * us);
        const n = SPLAT_ANGLES.length;
        for (let ring = 0; ring < 2; ring++) {
          const rf = ring === 0 ? 0.42 : 0.78;
          ctx.beginPath();
          for (let k = 0; k <= n; k++) {
            const idx = k % n;
            const a = SPLAT_ANGLES[idx];
            const l = SPLAT_LENGTHS[idx] * r * rf;
            const px = Math.cos(a) * l;
            const py = Math.sin(a) * l;
            if (k === 0) {
              ctx.moveTo(px, py);
            } else {
              const pa = SPLAT_ANGLES[(k - 1) % n];
              const midA = idx === 0 ? (pa + a + Math.PI * 2) * 0.5 : (pa + a) * 0.5;
              const ml = (SPLAT_LENGTHS[(k - 1) % n] + SPLAT_LENGTHS[idx]) * 0.5 * r * rf * 0.72;
              ctx.quadraticCurveTo(Math.cos(midA) * ml, Math.sin(midA) * ml, px, py);
            }
          }
          ctx.stroke();
        }

        ctx.fillStyle = '#ffffff';
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.ellipse(0, 0, 2.6 * us * (r / (7.5 * us)), 1.8 * us * (r / (7.5 * us)), 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      /**
       * Comic speech bubble (no measureText - width estimated from character count).
       */
      function drawComicBubble(x, y, text, s, alpha, rot) {
        if (alpha <= 0.02) return;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(x, y);
        ctx.rotate(rot);
        const w = text.length * 5.0 * s + 10 * s;
        ctx.fillStyle = '#fffef2';
        ctx.strokeStyle = '#080608';
        ctx.lineWidth = 1.6 * s;
        traceRoundedRect(-w * 0.5, -8 * s, w, 16 * s, 5 * s);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#c81d25';
        ctx.font = '900 ' + Math.round(8.5 * s) + 'px Impact, Arial Black, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 0, 0.5 * s);
        ctx.restore();
      }

      function drawHeartShape(x, y, h) {
        const w = h * 0.5;
        ctx.beginPath();
        ctx.moveTo(x, y + h * 0.3);
        ctx.bezierCurveTo(x, y, x - w, y, x - w, y + h * 0.3);
        ctx.bezierCurveTo(x - w, y + h * 0.6, x, y + h * 0.75, x, y + h);
        ctx.bezierCurveTo(x, y + h * 0.75, x + w, y + h * 0.6, x + w, y + h * 0.3);
        ctx.bezierCurveTo(x + w, y, x, y, x, y + h * 0.3);
        ctx.closePath();
      }

      function drawSweatDrop(x, y, size, alpha) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#bfe6ff';
        ctx.strokeStyle = '#0f1423';
        ctx.lineWidth = Math.max(0.6, 0.8 * uniformScale);
        ctx.beginPath();
        ctx.moveTo(x, y - size);
        ctx.quadraticCurveTo(x + size * 0.8, y + size * 0.2, x, y + size * 0.6);
        ctx.quadraticCurveTo(x - size * 0.8, y + size * 0.2, x, y - size);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      /**
       * Mini-reactions when the cursor rests on the special card Spider-Man is perched on.
       */
      function drawCardReaction(s) {
        const a = spidey.reactionBlend;
        if (a < 0.03 || spidey.isSwinging || !spidey.headWorldX) return;
        const hx = spidey.headWorldX;
        const hy = spidey.headWorldY;
        const f = spidey.facing;
        const pop = Math.min(1, a * 1.3);
        const bx = hx + f * 22 * s;
        const by = hy - 20 * s - (1 - pop) * 6 * s;
        const code = spidey.reactionCode;

        if (code === REACT_HEARTS) {
          ctx.save();
          ctx.fillStyle = '#ff4d6d';
          ctx.strokeStyle = '#080608';
          ctx.lineWidth = 0.9 * s;
          for (let k = 0; k < 3; k++) {
            const p = (elapsedTime * 0.55 + k / 3) % 1;
            ctx.globalAlpha = a * Math.sin(p * Math.PI);
            const size = (5 + p * 2.5) * s;
            drawHeartShape(hx + (k - 1) * 9 * s + Math.sin(p * 6 + k) * 3 * s, hy - 14 * s - p * 28 * s, size);
            ctx.fill();
            ctx.stroke();
          }
          ctx.restore();
        } else if (code === REACT_MUSIC) {
          ctx.save();
          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          for (let k = 0; k < 3; k++) {
            const p = (elapsedTime * 0.5 + k / 3) % 1;
            ctx.globalAlpha = a * Math.sin(p * Math.PI) * 0.95;
            ctx.font = 'bold ' + Math.round((9 + p * 3) * s) + 'px sans-serif';
            ctx.fillText(k === 1 ? '\u266B' : '\u266A', hx + f * (10 + k * 6) * s + Math.sin(p * 7 + k) * 3 * s, hy - 10 * s - p * 26 * s);
          }
          ctx.restore();
        } else if (code === REACT_CAMERA) {
          const p = (elapsedTime * 0.7) % 1;
          const flash = p < 0.12 ? 1 - p / 0.12 : 0;
          if (flash > 0.01) {
            const fx = hx + f * 16 * s;
            const fy = hy - 2 * s;
            const r = 11 * s * (0.6 + flash * 0.4);
            ctx.save();
            ctx.globalAlpha = a * flash;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(fx, fy - r);
            ctx.quadraticCurveTo(fx, fy, fx + r, fy);
            ctx.quadraticCurveTo(fx, fy, fx, fy + r);
            ctx.quadraticCurveTo(fx, fy, fx - r, fy);
            ctx.quadraticCurveTo(fx, fy, fx, fy - r);
            ctx.fill();
            ctx.restore();
          }
          drawComicBubble(bx, by, 'CLICK!', s, a, -0.1 * f);
        } else if (code === REACT_OWW) {
          const shake = Math.sin(elapsedTime * 40) * 1.2 * s;
          drawComicBubble(bx + shake, by, 'OWW!', s, a, -0.14 * f);
          drawSweatDrop(hx - f * 13 * s, hy - 6 * s + ((elapsedTime * 0.8) % 1) * 5 * s, 3.2 * s, a);
        } else if (code === REACT_SWEAT) {
          drawSweatDrop(hx - f * 13 * s, hy - 8 * s + ((elapsedTime * 0.6) % 1) * 6 * s, 3.4 * s, a);
          drawComicBubble(bx, by, '...', s, a, 0);
        } else if (code === REACT_GIMME) {
          drawComicBubble(bx, by - Math.abs(Math.sin(elapsedTime * 6)) * 2 * s, 'GIMME!', s, a, -0.12 * f);
        } else if (code === REACT_HELLYES) {
          drawComicBubble(bx, by, 'HELL YES!', s, a, -0.1 * f);
        } else if (code === REACT_AWESOME) {
          drawComicBubble(bx, by, 'AWESOME.', s, a, -0.06 * f);
        } else if (code === REACT_CONFUSED) {
          drawComicBubble(bx, by, '?!', s, a, 0.1 * f);
        } else if (code === REACT_OUCH) {
          drawComicBubble(bx, by, 'ouch...', s, a, 0.05 * f);
        } else if (code === REACT_CHILL) {
          drawComicBubble(bx, by, 'NICE.', s, a, -0.05 * f);
        }
      }

      /**
       * Helper: Draws an outlined chibi limb segment.      /**
       * Helper: Draws an outlined chibi limb segment.
       */
      function drawOutlinedSegment(x1, y1, x2, y2, thickness, fillColor, inkWidth) {
        ctx.strokeStyle = '#07070b';
        ctx.lineWidth = thickness + inkWidth * 2;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();

        ctx.strokeStyle = fillColor;
        ctx.lineWidth = thickness;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }

      /**
       * Draws the Chibi Spider-Man Head using pre-allocated typed arrays (HEAD_SPOKES, HEAD_RADII_FACTORS)
       * and smooth squash-turn scaling (`facingScale`).
       */
      function drawChibiHead(cx, cy, s, facingScale, squintAmount) {
        ctx.save();
        ctx.translate(cx, cy);
        const dirSign = facingScale >= 0 ? 1 : -1;
        const absTurn = Math.max(0.28, Math.abs(facingScale));
        ctx.scale(dirSign * absTurn, 1 + (1 - absTurn) * 0.08);

        const rx = 13.6 * s;
        const ry = 10.6 * s;

        // 1. Big Chibi Horizontal-Oval Head Base
        ctx.beginPath();
        ctx.ellipse(0, 0, rx, ry, -0.04, 0, Math.PI * 2);
        ctx.fillStyle = '#c81d25';
        ctx.fill();

        ctx.save();
        ctx.clip();

        // 2. Dark Burgundy Crescent Shadow on the left/rear side
        ctx.fillStyle = '#680c10';
        ctx.beginPath();
        ctx.ellipse(-rx * 0.42, 0, rx * 0.85, ry * 1.05, 0, 0, Math.PI * 2);
        ctx.fill();

        // Re-fill main lit crimson face area shifted right
        ctx.fillStyle = '#cc2028';
        ctx.beginPath();
        ctx.ellipse(rx * 0.22, -ry * 0.05, rx * 0.92, ry * 0.98, 0, 0, Math.PI * 2);
        ctx.fill();

        // 3. Mask Webbing Grid (using pre-allocated Float32Arrays)
        const wx = 4.8 * s;
        const wy = 1.4 * s;
        ctx.strokeStyle = 'rgba(15, 8, 10, 0.72)';
        ctx.lineWidth = Math.max(0.8, 0.92 * s);

        ctx.beginPath();
        for (let i = 0; i < HEAD_SPOKES.length; i++) {
          const a = HEAD_SPOKES[i];
          ctx.moveTo(wx, wy);
          ctx.lineTo(wx + Math.cos(a) * rx * 1.6, wy + Math.sin(a) * ry * 1.6);
        }
        ctx.stroke();

        for (let rIdx = 0; rIdx < HEAD_RADII_FACTORS.length; rIdx++) {
          ctx.beginPath();
          ctx.arc(wx, wy, HEAD_RADII_FACTORS[rIdx] * s, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.restore();

        // Outer dark ink border around the chibi head
        ctx.strokeStyle = '#080608';
        ctx.lineWidth = 1.6 * s;
        ctx.beginPath();
        ctx.ellipse(0, 0, rx, ry, -0.04, 0, Math.PI * 2);
        ctx.stroke();

        // 4. Giant Expressive Chibi Eyes
        const sq = Math.max(0, Math.min(1, squintAmount));

        // Eye tracking: convert the world look direction into head-local space
        const lcos = Math.cos(spidey.headRot);
        const lsin = Math.sin(spidey.headRot);
        const lookLX = (spidey.lookX * lcos + spidey.lookY * lsin) * dirSign;
        const lookLY = (-spidey.lookX * lsin + spidey.lookY * lcos) * spidey.headFlipY;
        const eyeDX = lookLX * s;
        const eyeDY = lookLY * 0.9 * s;

        // --- LEFT (MAIN FRONT) EYE ---
        ctx.save();
        ctx.translate(-2.2 * s + eyeDX * 0.6, 0.6 * s + eyeDY * 0.6);
        ctx.rotate(0.08 - sq * 0.05);

        const leftEyeW = 5.8 * s;
        const leftEyeH = (4.8 * (1 - sq * 0.52)) * s;

        ctx.fillStyle = '#050507';
        ctx.beginPath();
        ctx.ellipse(0, 0, leftEyeW + 1.4 * s, leftEyeH + 1.35 * s, 0, 0, Math.PI * 2);
        ctx.fill();

        const leftWhiteW = (5.6 - sq * 0.7) * s;
        const leftWhiteH = (4.4 * (1 - sq * 0.78)) * s;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(eyeDX * 0.45, eyeDY * 0.45, leftWhiteW, Math.max(0.75 * s, leftWhiteH), 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // --- RIGHT (FAR / 3/4 SIDE) EYE ---
        ctx.save();
        ctx.translate(9.6 * s + eyeDX * 0.5, 0.5 * s + eyeDY * 0.6);
        ctx.rotate(-0.14 + sq * 0.06);

        const rightEyeW = 3.2 * s;
        const rightEyeH = (4.5 * (1 - sq * 0.52)) * s;

        ctx.fillStyle = '#050507';
        ctx.beginPath();
        ctx.ellipse(0, 0, rightEyeW + 1.25 * s, rightEyeH + 1.3 * s, 0, 0, Math.PI * 2);
        ctx.fill();

        const rightWhiteW = (3.0 - sq * 0.4) * s;
        const rightWhiteH = (4.1 * (1 - sq * 0.78)) * s;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(0.2 * s + eyeDX * 0.35, eyeDY * 0.4, rightWhiteW, Math.max(0.7 * s, rightWhiteH), 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.restore();
      }

      /**
       * Draws the compact Chibi Torso from the reference image.
       */
      function drawChibiTorso(cx, cy, w, h, s) {
        ctx.save();
        ctx.translate(cx, cy);

        const halfW = w * 0.5;
        const halfH = h * 0.5;

        ctx.beginPath();
        ctx.moveTo(-halfW * 0.82, -halfH);
        ctx.lineTo(halfW * 0.82, -halfH);
        ctx.quadraticCurveTo(halfW * 1.05, 0, halfW, halfH);
        ctx.lineTo(-halfW, halfH);
        ctx.quadraticCurveTo(-halfW * 1.05, 0, -halfW * 0.82, -halfH);
        ctx.closePath();

        ctx.fillStyle = '#13284c';
        ctx.fill();

        ctx.save();
        ctx.clip();

        ctx.fillStyle = '#c81d25';
        ctx.beginPath();
        ctx.moveTo(-halfW * 0.65, -halfH);
        ctx.lineTo(halfW * 0.65, -halfH);
        ctx.lineTo(halfW * 0.58, halfH * 0.48);
        ctx.lineTo(0, halfH * 0.98);
        ctx.lineTo(-halfW * 0.58, halfH * 0.48);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#080608';
        ctx.lineWidth = 1.0 * s;
        ctx.stroke();

        ctx.strokeStyle = 'rgba(12, 8, 10, 0.72)';
