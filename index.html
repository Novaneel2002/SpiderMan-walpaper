        sortDrawOrderByScale();

        for (let i = 0; i < CARD_COUNT; i++) {
          drawCard(cards[drawOrder[i]]);
        }

        // 8. Update and render the Chibi Spider-Man on top of the cards
        updateSpiderMan(dt);
        drawSpiderMan();
      }

      // Pointer, Click & Visibility Event Listeners
      window.addEventListener('mousemove', function (e) {
        rawMouseX = e.clientX;
        rawMouseY = e.clientY;
        timeSinceMouseMove = 0;
        if (!isPointerActive) {
          smoothMouseX = rawMouseX;
          smoothMouseY = rawMouseY;
          isPointerActive = true;
        }
      }, { passive: true });

      window.addEventListener('mousedown', function (e) {
        if (!config.showSpidey || !spidey.initialized) return;
        const clickX = e.clientX;
        const clickY = e.clientY;
        const s = uniformScale * config.spideyScale;

        // 1. Check if the user clicked directly on Chibi Spider-Man
        const distToSpidey = Math.hypot(clickX - spidey.x, clickY - (spidey.y - 12 * s));
        if (distToSpidey <= 28 * s) {
          spidey.flipTimer = 1.0;
          spidey.idleTime = 0;
          spidey.sassyBlend = 0;
          spidey.sitBlend = 0;
          spidey.deepIdleBlend = 0;
          clickEffect.active = true;
          clickEffect.timer = 0;
          clickEffect.isSpideyClick = true;
          return;
        }

        // 2. Check if the user clicked on any image card -> shoot "THWIP!" web & swing there
        for (let i = CARD_COUNT - 1; i >= 0; i--) {
          const idx = drawOrder[i];
          const c = cards[idx];
          const currentScale = c.scale * (1 + audioEnergy * 0.025);
          const halfW = (c.baseW * currentScale) * 0.5;
          const halfH = (c.baseH * currentScale) * 0.5;
          const dx = clickX - (c.cx + c.offsetX);
          const dy = clickY - (c.cy + c.offsetY);

          if (Math.abs(dx) <= halfW && Math.abs(dy) <= halfH) {
            spidey.facing = (clickX - spidey.x) >= 0 ? 1 : -1;
            clickEffect.active = true;
            clickEffect.timer = 0;
            clickEffect.isSpideyClick = false;
            clickEffect.targetX = clickX;
            clickEffect.targetY = clickY;
            clickEffect.cardIdx = idx;
            clickEffect.relX = dx / Math.max(1, c.baseW * currentScale);
            clickEffect.relY = dy / Math.max(1, c.baseH * currentScale);

            if (idx !== spidey.currentCard) {
              requestSwingToCard(idx);
            }
            break;
          }
        }
      }, { passive: true });

      window.addEventListener('mouseleave', function () {
        isPointerActive = false;
      }, { passive: true });

      document.addEventListener('visibilitychange', function () {
        isPageHidden = document.hidden;
        if (!isPageHidden && !rafId) {
          lastFrameTime = performance.now();
          rafId = requestAnimationFrame(renderFrame);
        }
      });

      window.addEventListener('resize', handleResize, { passive: true });

      /**
       * Lively Wallpaper Settings Panel Listener (wired to LivelyProperties.json)
       */
      window.livelyPropertyListener = function (name, val) {
        switch (name) {
          case 'showSpidey':
            config.showSpidey = Boolean(val);
            break;
          case 'spideyScale':
            config.spideyScale = Math.max(0.6, Math.min(2.0, Number(val) || 1.15));
            break;
          case 'magnetStrength':
            config.maxMagnetScale = 1.0 + Math.max(0.05, Math.min(0.5, Number(val) || 0.22));
            break;
          case 'magnetRadius':
            config.magnetRadius = Math.max(90, Math.min(350, Number(val) || 185));
            scaledMagnetRadius = config.magnetRadius * uniformScale;
            break;
          case 'grainAmount':
            config.grainAmount = Math.max(0, Math.min(0.25, Number(val) || 0.085));
            break;
          case 'idleSitDelay':
            config.idleSitDelay = Math.max(2, Math.min(20, Number(val) || 5.0));
            break;
        }
      };

      /**
       * Optional Lively Wallpaper Audio API Listener
       */
      window.livelyAudioListener = function (audioArray) {
        if (!audioArray || !audioArray.length) return;
        let bassSum = 0;
        const bins = Math.min(16, audioArray.length);
        for (let i = 0; i < bins; i++) {
          bassSum += audioArray[i];
        }
        targetAudioEnergy = Math.min(1, bassSum / bins);
      };

      // Tiny public API: the character remains self-contained in this HTML file,
      // but can also be controlled by another script or a host wallpaper panel.
      // Example: SpiderManChibi.setScale(1.35); SpiderManChibi.setVisible(false);
      window.SpiderManChibi = {
        setScale: function (value) {
          config.spideyScale = Math.max(0.6, Math.min(2.0, Number(value) || 1.15));
        },
        setVisible: function (value) {
          config.showSpidey = Boolean(value);
        },
        swingTo: function (cardIndex) {
          const idx = Math.max(0, Math.min(CARD_COUNT - 1, Number(cardIndex) || 0));
          requestSwingToCard(idx);
        }
      };

      // Initialize layout and start animation loop
      handleResize();
      rafId = requestAnimationFrame(renderFrame);
    })();
  </script>
</body>

</html>
